<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>截图数据 · 复盘工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/metrics.css"><script defer src="/metrics.js"></script></head>
<body><main class="metrics-main"><header><a href="/">← 人工复核</a><a href="/start">运行任务</a><a href="/logs">运行日志</a></header>
<section class="intro"><div><div class="eyebrow">SCREENSHOT / CHECK / SAVE</div><h1>把作品数据，留作复盘证据。</h1><p>上传“作品数据详情”截图，对照原图核对后保存。</p></div></section>
<section class="upload-panel"><label class="field"><span>选择截图（PNG / JPEG，最多 10MB）</span><input id="file" type="file" accept="image/png,image/jpeg" disabled></label><button id="upload" class="primary" disabled>上传原图</button><p class="helper" id="upload-hint">上传仅保存到本机。点击“识别截图”才会向已配置的 DashScope 发送图片，产生一次模型调用；失败不自动重试。</p></section>
<details id="history-panel" open><summary>之前上传的截图</summary><label class="field"><span>已导入记录</span><select id="history"><option value="">选择记录</option></select></label></details>
<div id="notice" role="status" aria-live="polite"></div>
<section id="editor" hidden><div class="metrics-grid"><aside class="original"><h2>截图原件</h2><div class="image-tools"><label>查看比例 <select id="image-scale"><option value="fit">适合宽度（不放大小图）</option><option value="1">原尺寸 · 100%</option><option value="2">放大 · 200%</option></select></label><a id="original-link" target="_blank" rel="noopener">打开原图 ↗</a></div><p id="image-info" class="helper"></p><p id="image-warning" role="status"></p><div id="image-viewport" class="image-viewport fit"><img id="original" alt="待核对的数据截图"></div><p class="helper">长截图可在图框内上下滚动，放大后也可左右滚动。图中无该指标时留空；未知不等于 0。</p><button id="recognize" class="primary">识别截图 · 1 次调用</button><p id="recognition-state"></p><details><summary>查看原始识别结果</summary><pre id="raw"></pre></details></aside>
<form id="confirm-form" class="metric-form"><h2>核对数据</h2><p class="helper">确认会保存一份独立快照，可在“开始复盘”中选入本轮数据计算。不会改写历史复盘，也不自动判定修改有效。</p>
<label class="field"><span>作品名称（必填）</span><input id="title" required maxlength="300" placeholder="例如：星河生日蛋糕"></label>
<label class="field"><span>关联已登记视频（可选）</span><select id="sample"><option value="">独立记录／暂不关联</option></select></label>
<label class="field"><span>视频发布时间（北京时间）</span><input id="published" type="datetime-local"><small id="published-hint">从截图顶部识别；看不清时留空。与截图统计时间分别保存。</small></label>
<label class="field"><span>截图对应的统计时间（必填，北京时间）</span><input id="observed" type="datetime-local" required><small>请填截图时点；上传时间和手机状态栏时钟不能代替完整日期。</small></label>
<label class="field"><span>顶部指标卡片的统计范围</span><select id="scope"><option value="unknown">不确定</option><option value="cumulative">截至截图时累计</option><option value="period">指定时段（请在备注填写起止时间）</option></select></label>
<div id="metric-fields" class="number-grid"></div>
<label class="field"><span>备注／统计时段</span><textarea id="note" maxlength="3000" placeholder="可记录口径、识别修正或指定时段。评论量不等于索要链接人数。"></textarea></label>
<label class="review-check"><input id="reviewed" type="checkbox" required> 我已对照原图核对数字、作品和统计时间</label>
<button id="confirm" class="primary" type="submit">确认并保存数据</button><div id="form-notice" role="status" aria-live="polite"></div><p id="saved-summary"></p>
</form></div></section></main></body></html>
