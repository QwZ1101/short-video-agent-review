<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>复盘工作台 · 复核与改进</title><link rel="stylesheet" href="/style.css"><script defer src="/tasks.js"></script><script defer src="/app.js"></script></head>
<body>
<aside class="rail"><a class="brand" href="/">复<span>盘</span><small>REVIEW WORKSPACE</small></a><div class="rail-label">创作工作流</div><div class="step">01 <span>整理材料</span><i>✓</i></div><div class="step">02 <span>内容分析</span><i>✓</i></div><div class="step">03 <span>证据验证</span><i>✓</i></div><div class="step active">04 <span>人工复核</span><i>●</i></div><div class="rail-bottom"><span class="live-dot"></span> 本机工作台<p>教程讲解类 · 首版<br>每个判断，都可以回到证据。</p></div></aside>
<main><header><div>创作复盘 <span class="slash">/</span> 人工复核</div><a href="/logs">运行日志 ↗</a><span class="local">本页不调用模型</span></header>
<section class="intro"><div><div class="eyebrow">HUMAN REVIEW / 04</div><h1>让建议，经得起核对。</h1><p>对照原始材料，决定哪些建议值得采用。</p></div><label class="run-picker">复核任务<select id="runs" aria-label="复核任务"><option>正在读取任务…</option></select></label></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="loading">正在读取本机报告与证据…</div>
<div id="workspace" hidden>
<section class="task-card"><div><span class="eyebrow" id="sample"></span><h2 id="goal"></h2><p id="audience"></p></div><div class="task-meta"><span id="status" class="badge"></span><span id="coverage"></span></div></section>
<div class="notice"><strong>复核边界</strong><span id="boundary"></span></div>
<nav id="workspace-views" class="view-tabs" hidden aria-label="工作区"><button id="view-review">复核结果</button><button id="view-tasks">修改与验证</button></nav>
<section id="review-view">
<div class="work-layout"><section class="review-column"><div class="section-head"><h2>逐项核对 <span id="count"></span></h2><span>先看证据，再做决定</span></div><nav id="tabs" aria-label="复核条目"></nav><article id="review-card"></article></section>
<aside class="evidence-column"><div class="section-head"><h2>证据原件</h2><span id="evidence-count"></span></div><p class="helper">建议引用的材料优先显示，也可以查看全部证据。</p><label for="evidence-select" class="sr-only">选择证据</label><select id="evidence-select"></select><div id="evidence-view"></div><details class="limits"><summary>查看模型声明的局限</summary><ul id="limitations"></ul></details></aside></div>
<footer class="action-bar"><div><strong id="progress"></strong><span id="saved">尚未保存人工反馈</span> <a id="report" hidden target="_blank" rel="noopener">查看保存记录</a></div><div class="actions"><button id="save" class="secondary">保存草稿</button><button id="submit" class="primary">提交本轮复核 <span>↗</span></button></div></footer>
</section><section id="tasks-view" hidden><div id="task-message" role="status" aria-live="polite"></div><div id="task-board"></div></section>
</div></main>
</body></html>
